<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PC Kiosk">
  <meta name="theme-color" content="#0a0a1a">
  <title>Pooja's Couture — Try-On Kiosk</title>
  <link rel="icon" type="image/png" href="../assets/logo-mark.png">

  <!-- Brand Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.2"></script>

  <!-- Main app design system -->
  <link rel="stylesheet" href="../css/app.css?v=20260924i">

  <!-- Supabase + config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
  <script src="../js/config.js?v=20260724"></script>
  <script src="../js/theme.js?v=20260916f"></script>

  <style>
    body, html { overflow-x: hidden; max-width: 100vw; }

    .kiosk-camera-frame {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      border-radius: var(--radius-lg, 12px);
      overflow: hidden;
      background: #000;
      aspect-ratio: 3 / 4;
    }
    .kiosk-camera-frame video,
    .kiosk-camera-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .kiosk-garment-strip { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 10px; -webkit-overflow-scrolling: touch; }
    .kiosk-garment-chip {
      flex-shrink: 0; width: 84px; height: 100px; border-radius: 10px; overflow: hidden;
      border: 2px solid transparent; cursor: pointer; background: var(--pc-bg-card);
      transition: border-color 0.15s, transform 0.15s;
    }
    .kiosk-garment-chip img { width: 100%; height: 100%; object-fit: cover; }
    .kiosk-garment-chip.active { border-color: var(--pc-gold); transform: scale(1.04); }

    .kiosk-result-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 500;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    /* .kiosk-result-overlay's own display:flex has equal CSS specificity
       to the shared .d-none class and comes later in the cascade, so it
       was winning and keeping this element visible even with d-none
       applied. #id selector guarantees this wins instead. */
    #kiosk-result-overlay.d-none { display: none; }
    .kiosk-result-overlay img { max-width: 100%; max-height: 80vh; border-radius: 10px; }
  </style>
</head>
<body class="portal-kiosk">

  <div id="gate-screen" class="auth-overlay active">
    <div class="login-card text-center">
      <div class="brand-header">
        <img src="../assets/logo-wordmark-light.png" alt="Pooja's Couture" class="brand-wordmark">
        <h2 class="font-display" style="display:flex;align-items:center;justify-content:center;gap:0.4em;white-space:nowrap;">
          <img src="../assets/28_camera.png" alt="" style="height:1em;width:auto;object-fit:contain;display:inline-block;vertical-align:middle;position:relative;top:-0.06em;">
          <span>Try-On Kiosk</span>
        </h2>
        <p class="text-muted text-xs" id="gate-message">Checking your session…</p>
      </div>
      <div id="gate-actions" class="d-none">
        <a href="../index.html" class="btn btn-primary w-full">Go to Login</a>
      </div>
    </div>
  </div>

  <!-- Main Kiosk Workspace -->
  <div id="kiosk-workspace" class="d-none">
    <header class="workspace-header d-flex justify-between items-center" style="padding:12px 16px;">
      <div class="d-flex items-center gap-2">
        <img src="../assets/logo-wordmark-light.png" alt="Pooja's Couture" style="height:22px;">
      </div>
      <button type="button" class="btn btn-secondary btn-sm" id="btn-logout">Exit Kiosk</button>
    </header>

    <div style="padding:16px;max-width:520px;margin:0 auto;">
      <h2 class="font-display" style="font-size:1.3rem;text-align:center;margin-bottom:4px;">See It On You</h2>
      <p class="text-muted text-xs text-center mb-4">Take a photo, pick a garment, see yourself wearing it.</p>

      <div class="kiosk-camera-frame" id="kiosk-camera-frame">
        <video id="kiosk-video" autoplay playsinline muted></video>
      </div>
      <canvas id="kiosk-canvas" class="d-none"></canvas>

      <div class="d-flex justify-center gap-3 mt-3 mb-4">
        <button type="button" class="btn btn-primary" id="btn-capture">📷 Take Photo</button>
        <button type="button" class="btn btn-secondary d-none" id="btn-retake">Retake</button>
      </div>

      <div id="kiosk-garment-section" class="d-none">
        <div class="text-xs text-muted mb-2" style="font-weight:600;">Choose a garment</div>
        <div class="kiosk-garment-strip" id="kiosk-garment-strip"></div>
        <div class="text-center mt-3">
          <button type="button" class="btn btn-primary w-full" id="btn-generate" disabled>Show Me Wearing This</button>
          <div class="text-xs text-muted mt-2" id="kiosk-status"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="kiosk-result-overlay" class="kiosk-result-overlay d-none">
    <div class="text-center">
      <img id="kiosk-result-img" src="" alt="Generated try-on result">
      <div class="mt-3">
        <button type="button" class="btn btn-secondary" id="btn-result-close">Close</button>
      </div>
    </div>
  </div>

  <script src="../js/utils.js?v=20260724"></script>
  <script src="../js/store.js?v=20260917b"></script>
  <script src="../js/access.js?v=20260924b"></script>
  <script src="app.js?v=20260924d"></script>
</body>
</html>
