<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PC Logistics">
  <meta name="theme-color" content="#0a0a1a">
  <title>Pooja's Couture — Logistics Portal</title>
  <link rel="icon" type="image/png" href="../assets/logo-mark.png">

  <!-- Main app design system CSS -->
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">

  <!-- Supabase + config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0"></script>
  <script src="../js/config.js?v=20260724"></script>

  <style>
    /* ── KPI Drawer ─────────────────────────────────────── */
    #kpi-drawer {
      position: fixed;
      top: 0; right: -340px;
      width: 320px;
      height: 100vh;
      background: var(--pc-bg-card, #12122a);
      border-left: 1px solid var(--pc-border, #2a2a4a);
      z-index: 1000;
      transition: right 0.3s cubic-bezier(.4,0,.2,1);
      overflow-y: auto;
      padding: 20px 16px;
      box-shadow: -8px 0 32px rgba(0,0,0,0.4);
    }
    #kpi-drawer.open { right: 0; }
    #kpi-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    #kpi-overlay.open { opacity: 1; pointer-events: all; }

    @keyframes kpiIn {
      from { opacity:0; transform:translateY(10px) scale(.95); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }
    .kpi-tile {
      background: var(--pc-bg-dark, #0d0d1f);
      border: 1px solid var(--pc-border, #2a2a4a);
      border-radius: 10px;
      padding: 12px 10px;
      text-align: center;
      animation: kpiIn 0.35s ease both;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      cursor: default;
    }
    .kpi-tile:hover {
      transform: translateY(-3px) scale(1.04);
      border-color: var(--pc-gold, #d4af37);
      box-shadow: 0 6px 20px rgba(212,175,55,0.15);
    }
    .kpi-tile:hover .kpi-tile-value { color: var(--pc-gold, #d4af37); }
    .kpi-tile-label { font-size:10px; font-weight:700; color:var(--pc-text-muted,#888); text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }
    .kpi-tile-icon  { font-size:14px; margin-bottom:4px; }
    .kpi-tile-value { font-size:24px; font-weight:900; color:var(--pc-text,#fff); line-height:1; transition:color 0.2s; }

    /* Mobile full-width */
    @media (max-width: 600px) {
      #kpi-drawer { width: 85vw; }
      .nav-sidebar { display: none; }
      .main-content { margin-left: 0 !important; }
    }

    /* Header fix */
    body, html { overflow-x: hidden; max-width: 100vw; }
    #shipping-workspace { display:flex; flex-direction:column; min-height:100vh; overflow-x:hidden; }
    #shipping-workspace .workspace-header {
      display:flex !important; flex-direction:row !important;
      align-items:center !important; justify-content:space-between !important;
      flex-wrap:nowrap !important; height:60px; padding:0 14px;
      background:var(--pc-bg-sidebar,#1a1a3e);
      border-bottom:1px solid var(--pc-border,#2a2a4a);
      width:100%; box-sizing:border-box; position:sticky; top:0; z-index:100;
    }
    #shipping-workspace .user-profile {
      display:flex !important; flex-direction:row !important;
      align-items:center !important; gap:10px;
      flex-shrink:1; min-width:0; overflow:hidden;
    }
    #shipping-workspace .user-name { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #shipping-workspace .header-actions { flex-shrink:0; margin-left:8px; }
    #shipping-main { padding:14px; overflow-x:hidden; flex:1; box-sizing:border-box; }
    #shipping-main .card { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    @media (max-width:480px) {
      #shipping-workspace .workspace-header { height:56px; }
      .btn { min-height:42px; font-size:13px; }
      #shipping-main { padding:10px; }
    }
  </style>
</head>
<body>

  <!-- KPI Drawer -->
  <div id="kpi-overlay"></div>
  <div id="kpi-drawer">
    <div class="d-flex justify-between items-center mb-4">
      <div class="font-display text-md text-gold">📊 KPI Dashboard</div>
      <button id="kpi-close-btn" class="btn btn-secondary btn-sm">✕</button>
    </div>
    <div id="kpi-content">
      <div class="text-xs text-muted text-center p-4">Loading...</div>
    </div>
  </div>

  <!-- Gate screen -->
  <div id="gate-screen" class="auth-overlay active">
    <div class="login-card text-center">
      <div class="brand-header">
        <img src="../assets/logo-wordmark-light.png" alt="Pooja's Couture" class="brand-wordmark">
        <h2 class="font-display">Shipping &amp; Logistics</h2>
        <p class="text-muted text-xs" id="gate-message">Checking your session…</p>
      </div>
      <div id="gate-actions" class="d-none">
        <a href="../index.html" class="btn btn-primary w-full">Go to Login</a>
      </div>
    </div>
  </div>

  <!-- Main Workspace -->
  <div id="shipping-workspace" class="d-none">
    <header class="workspace-header">
      <div class="user-profile">
        <div class="avatar avatar-sm" id="user-avatar">??</div>
        <div>
          <div class="user-name" id="user-display-name">Loading...</div>
          <div class="user-role text-xs text-gold" id="user-display-role">Logistics</div>
        </div>
      </div>
      <div class="header-actions" style="display:flex;align-items:center;gap:8px;margin-left:auto">
        <button class="topbar-btn" id="btn-theme-toggle" title="Toggle light/dark mode" style="font-size:16px;background:none;border:none;cursor:pointer;padding:6px 8px;border-radius:var(--radius-md);line-height:1;display:flex;align-items:center;justify-content:center">🌙</button>
        <button class="btn btn-secondary btn-sm" id="btn-logout">Logout</button>
      </div>
    </header>
    <main class="workspace-content" id="shipping-main"></main>
  </div>

  <div id="toast-container"></div>

  <script src="../js/utils.js?v=20260724"></script>
  <script src="../js/store.js?v=20260724"></script>
  <script src="../js/invoicing.js?v=20260724"></script>
  <script src="app.js?v=20260724"></script>
</body>
</html>
