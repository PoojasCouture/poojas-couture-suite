<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pooja's Couture — AI Studio Team</title>
<link rel="icon" type="image/png" href="../assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.2"></script>
<link rel="stylesheet" href="../css/app.css?v=20260818a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
<script src="../js/config.js?v=20260724"></script>
<script src="../js/theme.js?v=20260812a"></script>
</head>
<body class="portal-ai-team">

<div class="app-container">

  <!-- Auth gate -->
  <div id="gate-screen" class="auth-overlay active">
    <div class="login-card text-center">
      <div class="brand-header">
        <img src="../assets/logo-wordmark-light.png" alt="Pooja's Couture" class="brand-wordmark" onerror="this.style.display='none'">
        <h2 class="font-display" style="font-size:var(--text-lg);color:var(--pc-gold);margin-bottom:var(--sp-2)">AI Studio Team</h2>
        <p class="text-muted text-xs" id="gate-message">Checking your session…</p>
      </div>
      <div id="gate-actions" class="d-none mt-4"></div>
    </div>
  </div>

  <!-- Main Workspace -->
  <div id="ai-team-workspace" class="d-none">

    <!-- SIDEBAR -->
    <div id="sidebar">
      <div class="brand">
        <div class="brand-top-row">
          <a href="../index.html" class="sidebar-brand-home" title="Back to main app">
            <div class="sidebar-brand-logo"><img src="../assets/logo-mark.png" alt="Pooja's Couture"></div>
            <img src="../assets/logo-wordmark-light.png" alt="Pooja's Couture" class="sidebar-wordmark" onerror="this.style.display='none'">
          </a>
          <button id="ai-sidebar-collapse-btn" class="sidebar-collapse-btn" title="Collapse sidebar">‹</button>
        </div>
        <div class="brand-sub">AI Studio Team</div>
      </div>

      <div class="team-label">Your Team</div>

      <button class="member-btn active" onclick="switchMember('ceo')" id="btn-ceo">
        <div class="avatar" style="color:rgb(200,113,90);--glow:rgba(200,113,90,0.65)"><i class="ph ph-crown-simple"></i></div>
        <div class="member-info">
          <div class="member-name">Priya</div>
          <div class="member-role">Delivery Lead</div>
          <div class="status-box idle" id="status-ceo"><span class="status-dot"></span><span class="status-text">Idle</span></div>
        </div>
      </button>

      <button class="member-btn" onclick="switchMember('coo')" id="btn-coo">
        <div class="avatar" style="color:rgb(212,168,75);--glow:rgba(212,168,75,0.65)"><i class="ph ph-gear-six"></i></div>
        <div class="member-info">
          <div class="member-name">Riya</div>
          <div class="member-role">Delivery Manager</div>
          <div class="status-box idle" id="status-coo"><span class="status-dot"></span><span class="status-text">Idle</span></div>
        </div>
      </button>

      <button class="member-btn" onclick="switchMember('marketing')" id="btn-marketing">
        <div class="avatar" style="color:rgb(120,100,180);--glow:rgba(120,100,180,0.65)"><i class="ph ph-megaphone"></i></div>
        <div class="member-info">
          <div class="member-name">Meera</div>
          <div class="member-role">Marketing Manager</div>
          <div class="status-box idle" id="status-marketing"><span class="status-dot"></span><span class="status-text">Idle</span></div>
        </div>
      </button>

      <button class="member-btn" onclick="switchMember('writer')" id="btn-writer">
        <div class="avatar" style="color:rgb(80,160,120);--glow:rgba(80,160,120,0.65)"><i class="ph ph-pen-nib"></i></div>
        <div class="member-info">
          <div class="member-name">Anika</div>
          <div class="member-role">Content Writer</div>
          <div class="status-box idle" id="status-writer"><span class="status-dot"></span><span class="status-text">Idle</span></div>
        </div>
      </button>

      <button class="member-btn" onclick="switchMember('designer')" id="btn-designer">
        <div class="avatar" style="color:rgb(180,120,160);--glow:rgba(180,120,160,0.65)"><i class="ph ph-palette"></i></div>
        <div class="member-info">
          <div class="member-name">Tara</div>
          <div class="member-role">Creative Designer</div>
          <div class="status-box idle" id="status-designer"><span class="status-dot"></span><span class="status-text">Idle</span></div>
        </div>
      </button>

      <button class="member-btn" onclick="switchMember('creator')" id="btn-creator">
        <div class="avatar" style="color:rgb(220,140,90);--glow:rgba(220,140,90,0.65)"><i class="ph ph-film-slate"></i></div>
        <div class="member-info">
          <div class="member-name">Dia</div>
          <div class="member-role">Content Creator</div>
          <div class="status-box idle" id="status-creator"><span class="status-dot"></span><span class="status-text">Idle</span></div>
        </div>
      </button>

      <!-- History -->
      <div class="team-label" style="margin-top:var(--sp-4)">Project History</div>
      <button class="member-btn" onclick="switchToHistory()" id="btn-history">
        <div class="avatar" style="color:rgb(100,140,200);--glow:rgba(100,140,200,0.65)"><i class="ph ph-clock-counter-clockwise"></i></div>
        <div class="member-info">
          <div class="member-name">History</div>
          <div class="member-role">All saved projects</div>
        </div>
      </button>

      <div class="sidebar-footer">
        <a href="#" class="back-link" onclick="goBackToApp(event)">← Back to Main App</a>
        <div class="powered-label">Powered by Claude AI</div>
      </div>
    </div>

    <!-- Mobile overlay — closes sidebar on tap outside it. Shared, unscoped rule in app.css. -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- MAIN -->
    <div id="main">
      <!-- Chat header -->
      <div id="chat-header">
        <button class="topbar-toggle" id="sidebar-toggle" aria-label="Toggle Sidebar"><i class="ph ph-list"></i></button>
        <div class="header-avatar" id="h-avatar" style="color:rgb(200,113,90);--glow:rgba(200,113,90,0.65)"><i class="ph ph-crown-simple"></i></div>
        <div class="header-info">
          <div class="h-name" id="h-name">Priya — Delivery Lead</div>
          <div class="h-tag" id="h-tag">Vision · Brand Strategy · Business Growth</div>
        </div>
        <div class="delegate-toggle" id="delegate-toggle" onclick="toggleDelegate()">
          <span class="dt-label">Auto-Delegate to Team</span>
          <div class="switch-track"><div class="switch-knob"></div></div>
        </div>
        <button id="btn-theme-toggle" title="Toggle light/dark mode" style="font-size:16px;background:none;border:none;cursor:pointer;padding:6px 8px;border-radius:6px;line-height:1;display:flex;align-items:center;justify-content:center;color:inherit"><i class="ph ph-moon"></i></button>
        <button id="save-convo-btn" onclick="saveConversation()" style="display:none;align-items:center;gap:6px;padding:6px 12px;font-size:12px;border-radius:6px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);color:var(--muted);cursor:pointer;transition:all 0.2s;" onmouseover="if(!this.disabled)this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='rgba(255,255,255,0.05)'">Save Conversation</button>
        <button class="clear-btn" onclick="clearChat()">Clear Chat</button>
      </div>

      <!-- Messages (chat view) -->
      <div id="messages"></div>

      <!-- History panel (hidden by default) -->
      <div id="history-panel" style="display:none;flex:1;overflow-y:auto;padding:var(--sp-4)">
        <div id="history-list"></div>
      </div>

      <!-- Input -->
      <div id="input-area">
        <textarea id="user-input" rows="1" placeholder="Ask your team member anything…" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button id="send-btn" onclick="sendMessage()">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>

  </div><!-- /workspace -->

</div><!-- /app-container -->

<script>
  function goBackToApp(e) {
    e.preventDefault();
    try {
      localStorage.setItem('pc_last_route', 'dashboard');
      localStorage.setItem('pc_skip_login_flash', '1');
    } catch(err) {}
    window.location.href = '../index.html';
  }
</script>
<script src="../js/sidebar.js?v=20260727f"></script>
<script src="app.js?v=20260818d"></script>
</body>
</html>
