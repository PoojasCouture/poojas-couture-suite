<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PC Tailor">
  <meta name="theme-color" content="#0a0a1a">
  <title>Pooja's Couture — Tailor Workstation</title>
  <link rel="icon" type="image/png" href="../assets/logo-mark.png">

  <!-- Brand Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.2"></script>

  <!-- Main app design system -->
  <link rel="stylesheet" href="../css/app.css?v=20260924l">

  <!-- Supabase + config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
  <script src="../js/config.js?v=20260724"></script>
  <script src="../js/theme.js?v=20260916f"></script>

  <style>
    /* Mobile-first workspace */
    body, html { overflow-x: hidden; max-width: 100vw; }

    .task-card {
      background: var(--pc-bg-card);
      border: 1px solid var(--pc-border);
      border-radius: var(--radius-lg, 12px);
      padding: 16px;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
      animation: pcCardIn 0.35s ease both;
    }
    .task-card:hover {
      border-color: var(--pc-gold, #d4af37);
      box-shadow: 0 4px 16px rgba(212,175,55,0.12);
      transform: translateY(-1px);
    }
    .task-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--pc-text-heading);
      margin: 0;
    }
    .measurement-badge {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--pc-border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--pc-text-muted);
      line-height: 1.5;
    }
    .tab-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .filter-tab {
      font-size: 13px;
      padding: 7px 16px;
      border-radius: 20px;
      font-weight: 600;
      border: 1px solid var(--pc-border);
      background: transparent;
      color: var(--pc-text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-tab.active {
      background: var(--pc-gold, #d4af37);
      color: #12122a;
      border-color: var(--pc-gold, #d4af37);
    }
    .filter-tab:hover:not(.active) {
      border-color: var(--pc-gold, #d4af37);
      color: var(--pc-gold, #d4af37);
    }
    .punch-card {
      background: linear-gradient(135deg, rgba(212,175,55,0.08) 0%, rgba(0,0,0,0) 60%);
      border: 1px solid rgba(212,175,55,0.2);
    }

    @media (max-width: 480px) {
      .workspace-content { padding: 12px !important; }
      .workspace-header { height: 56px; padding: 0 12px; }
      .btn { min-height: 44px; }
    }
  </style>
</head>
<body class="portal-tailor">
  <!-- Gate screen -->
  <div id="gate-screen" class="auth-overlay active">
    <div class="login-card text-center">
      <div class="brand-header">
        <img src="../assets/logo-wordmark-light.png" alt="Pooja's Couture" class="brand-wordmark">
        <h2 class="font-display" style="display:flex;align-items:center;justify-content:center;gap:0.4em;white-space:nowrap;">
          <img src="../assets/16_poojas_couture_sign.png?v=20260917e" alt="" style="height:1em;width:auto;object-fit:contain;display:inline-block;vertical-align:middle;position:relative;top:-0.06em;">
          <span>Karigar Workstation</span>
        </h2>
        <p class="text-muted text-xs" id="gate-message">Checking your session…</p>
      </div>
      <div id="gate-actions" class="d-none">
        <a href="../index.html" class="btn btn-primary w-full">Go to Login</a>
      </div>
    </div>
  </div>

  <!-- Main Workspace -->
  <div id="tailor-workspace" class="d-none">
    <header class="workspace-header">
      <div class="user-profile">
        <div class="avatar avatar-sm" id="user-avatar">??</div>
        <div>
          <div class="user-name" id="user-display-name">Loading...</div>
          <div class="user-role text-xs text-gold" id="user-display-role">Karigar</div>
        </div>
      </div>
      <div class="header-actions" style="display:flex;align-items:center;gap:8px;margin-left:auto">
        <button class="topbar-btn" id="btn-theme-toggle" title="Toggle light/dark mode" style="font-size:16px;background:none;border:none;cursor:pointer;padding:6px 8px;border-radius:var(--radius-md);line-height:1;display:flex;align-items:center;justify-content:center"><i class="ph ph-moon"></i></button>
        <button class="btn btn-secondary btn-sm" id="btn-logout">Logout</button>
      </div>
    </header>

    <main class="workspace-content">
      <!-- Punch Card -->
      <div class="card punch-card p-4 mb-4 animate-fade-in">
        <div class="d-flex justify-between items-center">
          <div>
            <div class="text-sm font-semibold text-gold"><i class="ph ph-timer"></i> Shift Punch Card</div>
            <div class="text-xs text-muted mt-1" id="punch-status-text">Not clocked in today</div>
          </div>
          <button class="btn btn-primary btn-sm" id="btn-punch">Clock In</button>
        </div>
      </div>

      <!-- Assignments -->
      <div class="d-flex justify-between items-center mb-3 animate-fade-in stagger-1">
        <div class="text-sm font-semibold text-gold"><i class="ph ph-scissors"></i> My Assignments</div>
        <span class="badge badge-muted font-mono" id="task-counter">0 Tasks</span>
      </div>

      <div class="tab-filters mb-4 animate-fade-in stagger-1">
        <button class="filter-tab active" data-filter="pending">Active Work</button>
        <button class="filter-tab" data-filter="completed">Completed</button>
      </div>

      <!-- Tasks List -->
      <div class="d-flex flex-col gap-3" id="tasks-list"></div>
    </main>
  </div>

  <div id="toast-container"></div>

  <script src="../js/utils.js?v=20260724"></script>
  <script src="../js/store.js?v=20260917b"></script>
    <script src="../js/access.js?v=20260924b"></script>
  <script src="app.js?v=20260917b"></script>
</body>
</html>
