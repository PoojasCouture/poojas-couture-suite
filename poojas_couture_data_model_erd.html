<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  CLIENTS ||--o{ ORDERS : places
  CLIENTS ||--o{ APPOINTMENTS : books
  CLIENTS ||--o{ SALES : buys
  CLIENTS ||--o{ EMAILS : receives
  PRODUCTS ||--o{ SALE_ITEMS : "sold in"
  PRODUCTS }o--|| SHIPMENTS : "arrives in"
  ORDERS ||--o{ ORDER_TAILORS : "worked by"
  EMPLOYEES ||--o{ ORDER_TAILORS : assigned
  ORDERS ||--o{ SALE_ITEMS : "billed as"
  SALES ||--o{ SALE_ITEMS : contains
  SALES ||--|| INVOICES : generates
  EMPLOYEES ||--o{ PAYROLL : paid
  EMPLOYEES ||--o{ ATTENDANCE : logs
  EMPLOYEES ||--o{ LEAVES : requests
  SHIPMENTS ||--o{ PRODUCTS : carries
  ORDERS ||--o{ SHIPMENTS : "shipped via"
  CLIENTS {
    uuid id PK
    string name
    string email
    string type
    date wedding_date
  }
  PRODUCTS {
    uuid id PK
    string sku
    string title
    string category
    decimal price
    string status
    uuid shipment_id FK
  }
  ORDERS {
    uuid id PK
    uuid client_id FK
    string title
    decimal price
    string status
  }
  ORDER_TAILORS {
    uuid id PK
    uuid order_id FK
    uuid employee_id FK
    string task
  }
  SALES {
    uuid id PK
    uuid client_id FK
    decimal total
    date sale_date
  }
  SALE_ITEMS {
    uuid id PK
    uuid sale_id FK
    uuid product_id FK
    uuid order_id FK
    decimal price
  }
  SHIPMENTS {
    uuid id PK
    string tracking_no
    string origin
    string status
  }
  EMPLOYEES {
    uuid id PK
    string name
    string role
    decimal salary
  }
  INVOICES {
    uuid id PK
    uuid sale_id FK
    decimal total
    string status
  }`);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
