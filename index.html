<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pooja's Couture — Enterprise Management Suite</title>
  <!-- SEO & Brand Metadata -->
  <meta name="description" content="Luxury internal operations management panel for Pooja's Couture. Clients, orders pipeline, bridal journeys, Australian payroll and accounting dashboard.">
  <link rel="icon" type="image/png" href="assets/logo-mark.png">

  <!-- Brand Typography: Playfair Display (display) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Phosphor Icons (replaces emoji nav icons) -->
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

  <!-- CSS Stylesheet (unified) -->
  <link rel="stylesheet" href="css/app.css?v=20260727i">
</head>
<body>

  <!-- Login Overlay -->
  <div id="login-overlay" class="auth-overlay active">
    <div class="login-card">
      <div class="brand-header">
        <img src="assets/logo-wordmark-light.png" alt="Pooja's Couture" class="brand-wordmark">
        <p class="text-muted text-xs">Operations Login</p>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Employee Email</label>
          <input type="email" id="login-email" class="form-input" placeholder="name@poojascouture.com" required value="pooja@poojascouture.com">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required value="couture123">
        </div>
        <button type="submit" class="btn btn-primary w-full">Sign In to Dashboard</button>
      </form>
    </div>
  </div>

  <div class="app-shell">
    
    <!-- Sidebar Layout -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-logo"><img src="assets/logo-mark.png" alt="Pooja's Couture"></div>
        <img src="assets/logo-wordmark-light.png" alt="Pooja's Couture" class="sidebar-wordmark">
      </div>

      <nav class="sidebar-nav">
        <!-- Dashboard Section -->
        <div class="sidebar-section">
          <button class="sidebar-link active" data-route="dashboard">
            <span class="sidebar-link-icon" style="color:rgb(90,140,200);--glow:rgba(90,140,200,0.65)"><i class="ph ph-chart-line-up"></i></span>
            <span class="sidebar-link-text">Overview Dashboard</span>
          </button>
        </div>

        <!-- CRM Section -->
        <div class="sidebar-section">
          <div class="sidebar-section-title">Client Relations</div>
          <button class="sidebar-link" data-route="crm">
            <span class="sidebar-link-icon" style="color:rgb(212,168,75);--glow:rgba(212,168,75,0.65)"><i class="ph ph-crown-simple"></i></span>
            <span class="sidebar-link-text">Sales Dashboard</span>
          </button>
        </div>

        <!-- Inventory Section -->
        <div class="sidebar-section">
          <div class="sidebar-section-title">Inventory</div>
          <button class="sidebar-link" data-route="products">
            <span class="sidebar-link-icon" style="color:rgb(100,170,130);--glow:rgba(100,170,130,0.65)"><i class="ph ph-shopping-bag"></i></span>
            <span class="sidebar-link-text">Stock & Inventory </span>
          </button>
        </div>        
        
        <!-- Accounting Section -->
        <div class="sidebar-section">
          <div class="sidebar-section-title">Ledger & Invoices</div>
          <button class="sidebar-link" data-route="accounting">
            <span class="sidebar-link-icon" style="color:rgb(70,170,190);--glow:rgba(70,170,190,0.65)"><i class="ph ph-coins"></i></span>
            <span class="sidebar-link-text">Accounting & Finance</span>
          </button>
        </div>        
        
        <!-- HRM Section -->
        <div class="sidebar-section">
          <div class="sidebar-section-title">Staff Operations</div>
          <button class="sidebar-link" data-route="hrm">
            <span class="sidebar-link-icon" style="color:rgb(150,110,190);--glow:rgba(150,110,190,0.65)"><i class="ph ph-users-three"></i></span>
            <span class="sidebar-link-text">Human Capital</span>
          </button>
        </div>

        <!-- Social CRM Studio Section -->
        <div class="sidebar-section">
          <div class="sidebar-section-title">Social & Marketing</div>
          <button class="sidebar-link" data-route="ai-team">
            <span class="sidebar-link-icon" style="color:rgb(220,140,90);--glow:rgba(220,140,90,0.65)"><i class="ph ph-sparkle"></i></span>
            <span class="sidebar-link-text">Social CRM Studio</span>
          </button>
        </div>

        <!-- Admin Section -->
        <div class="sidebar-section" id="sidebar-admin-section">
          <div class="sidebar-section-title">Administration</div>
          <button class="sidebar-link" data-route="admin">
            <span class="sidebar-link-icon" style="color:rgb(200,90,90);--glow:rgba(200,90,90,0.65)"><i class="ph ph-lock-key"></i></span>
            <span class="sidebar-link-text">Admin Center</span>
          </button>
        </div>

        <!-- Settings Section -->
        <div class="sidebar-section">
          <div class="sidebar-section-title">Configuration</div>
          <button class="sidebar-link" data-route="settings">
            <span class="sidebar-link-icon" style="color:rgb(130,130,150);--glow:rgba(130,130,150,0.65)"><i class="ph ph-gear-six"></i></span>
            <span class="sidebar-link-text">Boutique Settings</span>
          </button>
        </div>

        <!-- India Workshop Portals Section -->
        <div class="sidebar-section">
          <div class="sidebar-section-title">India Workstations</div>
          <a class="sidebar-link" href="tailor/index.html" target="_blank">
            <span class="sidebar-link-icon" style="color:rgb(200,150,190);--glow:rgba(200,150,190,0.65)"><i class="ph ph-needle"></i></span>
            <span class="sidebar-link-text">Tailor Portal</span>
          </a>
          <a class="sidebar-link" href="shipping/index.html" target="_blank">
            <span class="sidebar-link-icon" style="color:rgb(90,110,210);--glow:rgba(90,110,210,0.65)"><i class="ph ph-airplane-tilt"></i></span>
            <span class="sidebar-link-text">Logistics Cargo</span>
          </a>
        </div>
      </nav>

      <!-- Sidebar Footer User Profile -->
      <div class="sidebar-footer">
        <div class="sidebar-user" id="sidebar-user-trigger">
          <div class="sidebar-user-avatar">PS</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name">Pooja Shah</div>
            <div class="sidebar-user-role">Managing Director</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main Container -->
    <main class="main-content">
      
      <!-- Top Header Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="topbar-toggle" id="sidebar-toggle" aria-label="Toggle Sidebar"><i class="ph ph-list"></i></button>
          
          <div class="topbar-breadcrumb">
            <span class="topbar-breadcrumb-item">Pooja's Couture Suite</span>
            <span class="topbar-breadcrumb-separator">/</span>
            <span class="topbar-breadcrumb-current" id="topbar-breadcrumb-active">Overview Dashboard</span>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Live Clock -->
          <div class="topbar-datetime" id="topbar-clock">22 May 2026, 12:00 PM</div>
          
          <!-- Theme Toggle -->
          <button class="topbar-btn" id="btn-theme-toggle" title="Toggle light/dark mode"><i class="ph ph-moon"></i></button>

          <!-- Actions & Notifications -->
          <button class="topbar-btn" id="btn-notifications" title="Notifications">
            <i class="ph ph-bell"></i>
            <span class="topbar-btn-badge"></span>
          </button>
        </div>
      </header>

      <!-- Main Render Area -->
      <div id="main-content-area" class="page-content">
        <!-- Rendered screens dynamically placed here -->
      </div>
      
    </main>
  </div>

  <!-- Reusable Toast notifications -->
  <div id="toast-container"></div>

  <!-- Supabase client library (loaded from CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>

  <!-- Supabase config (your keys) -->
  <script src="js/config.js?v=20260724"></script>
  <script src="js/theme.js?v=20260726"></script>

  <!-- Shared Javascript Libraries -->
  <script src="js/utils.js?v=20260724"></script>
  <script src="js/store.js?v=20260724"></script>
  <script src="js/invoicing.js?v=20260727"></script>
  <script src="js/charts.js?v=20260724"></script>
  
  <!-- Modules logic -->
  <script src="js/crm.js?v=20260812a"></script>
  <script src="js/hrm.js?v=20260812b"></script>
  <script src="js/accounting.js?v=20260727"></script>
  <script src="js/admin.js?v=20260812d"></script>
  <script src="js/products.js?v=20260810"></script>
  
  <!-- Core application routing / initialization -->
  <script src="js/sidebar.js?v=20260727f"></script>
  <script src="js/app.js?v=20260812b"></script>
</body>
</html>
